# Ngrok Configuration File
# ملف تكوين Ngrok
#
# Create multiple tunnels for different webhook handlers
# إنشاء عدة أنفاق لمعالجات الويب هوك المختلفة

tunnels:
  # PHP Handler Tunnel (localhost:8001)
  # نفق معالج PHP
  php-handler:
    addr: 8001
    proto: http
    bind_tls: true
    inspect: true
    web_addr: 4042

  # Node.js Handler Tunnel (localhost:8002)
  # نفق معالج Node.js
  node-handler:
    addr: 8002
    proto: http
    bind_tls: true
    inspect: true
    web_addr: 4043

  # Python Flask Handler Tunnel (localhost:8003)
  # نفق معالج Python Flask
  flask-handler:
    addr: 8003
    proto: http
    bind_tls: true
    inspect: true
    web_addr: 4044

  # Python FastAPI Handler Tunnel (localhost:8004)
  # نفق معالج Python FastAPI
  fastapi-handler:
    addr: 8004
    proto: http
    bind_tls: true
    inspect: true
    web_addr: 4045
