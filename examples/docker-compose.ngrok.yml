# Docker Compose for Ngrok-only setup
# Docker Compose لإعداد Ngrok فقط

version: '3.8'

services:
  # Standalone Ngrok for exposing local webhook servers
  # Ngrok مستقل لكشف خوادم الويب هوك المحلية
  ngrok:
    image: wernight/ngrok:latest
    container_name: salla-zid-ngrok-standalone
    ports:
      - "4040:4040"
    environment:
      # Get your auth token from: https://dashboard.ngrok.com/get-started/your-authtoken
      # احصل على رمز المصادقة الخاص بك من: https://dashboard.ngrok.com/get-started/your-authtoken
      - NGROK_AUTH=${NGROK_AUTH_TOKEN}

      # The local service to expose
      # الخدمة المحلية المراد كشفها
      - NGROK_PORT=3000  # Change to match your local port / غير ليتطابق مع منفذك المحلي

      # Optional: Subdomain for consistent URL (requires paid ngrok account)
      # اختياري: نطاق فرعي لعنوان URL ثابت (يتطلب حساب ngrok مدفوع)
      # - NGROK_SUBDOMAIN=your-subdomain

      # Region selection: us, eu, ap, au (optional)
      # اختيار المنطقة: us, eu, ap, au (اختياري)
      - NGROK_REGION=eu
    command: ngrok http ${NGROK_PORT} --log=stdout
    restart: unless-stopped

  # Alternative: Use ngrok with multiple tunnels
  # بديل: استخدام ngrok مع عدة أنفاق
  ngrok-multi:
    image: wernight/ngrok:latest
    container_name: salla-zid-ngrok-multi
    ports:
      - "4041:4040"
    environment:
      - NGROK_AUTH=${NGROK_AUTH_TOKEN}
    volumes:
      - ./ngrok-config.yml /etc/ngrok-config.yml:ro
    command: ngrok start --all --config=/etc/ngrok-config.yml
    restart: unless-stopped
    profiles:
      - multi-tunnel
