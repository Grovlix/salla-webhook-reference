# Salla/Zid Webhook Testing Environment
# بيئة اختبار الويب هوك لـ Salla و Zid
#
# This Docker Compose configuration sets up a local testing environment
# يقوم تكوين Docker Compose هذا بإعداد بيئة اختبار محلية
# with ngrok for exposing your local server to the internet
# مع ngrok لجعل خادمك المحلي متاحاً على الإنترنت

version: '3.8'

services:
  # PHP/Laravel Webhook Handler
  # معالج الويب هوك بـ PHP/Laravel
  php-handler:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: salla-zid-php-webhook
    ports:
      - "8001:80"
    environment:
      - SALLA_WEBHOOK_SECRET=${SALLA_WEBHOOK_SECRET}
      - ZID_WEBHOOK_SECRET=${ZID_WEBHOOK_SECRET}
      - APP_ENV=local
      - APP_DEBUG=true
    volumes:
      - ./php:/var/www/html
    networks:
      - webhook-network
    restart: unless-stopped

  # Node.js/Express Webhook Handler
  # معالج الويب هوك بـ Node.js/Express
  node-handler:
    build:
      context: ./javascript
      dockerfile: Dockerfile
    container_name: salla-zid-node-webhook
    ports:
      - "8002:3000"
    environment:
      - SALLA_WEBHOOK_SECRET=${SALLA_WEBHOOK_SECRET}
      - ZID_WEBHOOK_SECRET=${ZID_WEBHOOK_SECRET}
      - NODE_ENV=development
      - PORT=3000
    volumes:
      - ./javascript:/app
      - /app/node_modules
    networks:
      - webhook-network
    restart: unless-stopped
    command: npm start

  # Python/Flask Webhook Handler
  # معالج الويب هوك بـ Python/Flask
  python-flask-handler:
    build:
      context: ./python
      dockerfile: Dockerfile.flask
    container_name: salla-zid-python-flask-webhook
    ports:
      - "8003:5000"
    environment:
      - SALLA_WEBHOOK_SECRET=${SALLA_WEBHOOK_SECRET}
      - ZID_WEBHOOK_SECRET=${ZID_WEBHOOK_SECRET}
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    volumes:
      - ./python:/app
    networks:
      - webhook-network
    restart: unless-stopped
    command: python flask_webhook_handler.py

  # Python/FastAPI Webhook Handler
  # معالج الويب هوك بـ Python/FastAPI
  python-fastapi-handler:
    build:
      context: ./python
      dockerfile: Dockerfile.fastapi
    container_name: salla-zid-python-fastapi-webhook
    ports:
      - "8004:8000"
    environment:
      - SALLA_WEBHOOK_SECRET=${SALLA_WEBHOOK_SECRET}
      - ZID_WEBHOOK_SECRET=${ZID_WEBHOOK_SECRET}
      - PORT=8000
    volumes:
      - ./python:/app
    networks:
      - webhook-network
    restart: unless-stopped
    command: uvicorn fastapi_webhook_handler:app --host 0.0.0.0 --port 8000

  # Ngrok Tunnel (optional)
  # نفق Ngrok (اختياري)
  # Exposes local services to the internet for webhook testing
  # يكشف الخدمات المحلية على الإنترنت لاختبار الويب هوك
  ngrok:
    image: wernight/ngrok:latest
    container_name: salla-zid-ngrok
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTH=${NGROK_AUTH_TOKEN}
      - NGROK_PROTOCOL=http
      - NGROK_PORT=php-handler:80
    networks:
      - webhook-network
    restart: unless-stopped
    depends_on:
      - php-handler
    profiles:
      - ngrok  # Use: docker-compose --profile ngrok up

  # Redis for queue management (optional)
  # Redis لإدارة الطوابير (اختياري)
  redis:
    image: redis:7-alpine
    container_name: salla-zid-redis
    ports:
      - "6379:6379"
    networks:
      - webhook-network
    restart: unless-stopped
    volumes:
      - redis-data:/data
    profiles:
      - redis  # Use: docker-compose --profile redis up

  # PostgreSQL for logging (optional)
  # PostgreSQL للتسجيل (اختياري)
  postgres:
    image: postgres:15-alpine
    container_name: salla-zid-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=webhooks
      - POSTGRES_USER=webhook_user
      - POSTGRES_PASSWORD=webhook_password
    networks:
      - webhook-network
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    profiles:
      - postgres  # Use: docker-compose --profile postgres up

networks:
  webhook-network:
    driver: bridge
    name: salla-zid-webhook-network

volumes:
  redis-data:
  postgres-data:
