<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OG Image Generator - Salla & Zid Webhook Reference</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .og-container {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #3eaf7c 0%, #34947c 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 60px 80px;
      box-sizing: border-box;
      position: relative;
    }
    .og-content {
      flex: 1;
      color: white;
    }
    .og-title {
      font-size: 48px;
      font-weight: 700;
      margin: 0 0 20px 0;
      line-height: 1.2;
    }
    .og-subtitle {
      font-size: 24px;
      opacity: 0.9;
      margin: 0;
      font-weight: 400;
    }
    .og-arabic {
      font-family: 'Cairo', 'Arial', sans-serif;
      text-align: right;
      direction: rtl;
      margin-top: 30px;
      font-size: 28px;
      opacity: 0.85;
    }
    .og-platforms {
      display: flex;
      gap: 20px;
      margin-top: 40px;
    }
    .platform-badge {
      background: rgba(255,255,255,0.2);
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
    }
    .og-visual {
      display: flex;
      align-items: center;
      gap: 30px;
    }
    .webhook-icon {
      width: 120px;
      height: 120px;
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .webhook-icon svg {
      width: 70px;
      height: 70px;
      fill: white;
    }
    .salla-logo, .zid-logo {
      width: 100px;
      height: 50px;
      background: white;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #333;
    }
    .instructions {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="og-container">
    <div class="og-content">
      <h1 class="og-title">Salla & Zid<br>Webhook Reference</h1>
      <p class="og-subtitle">Complete webhook documentation for MENA e-commerce platforms</p>
      <p class="og-arabic">دليل شامل لـ Webhooks منصتي سلة وزد</p>
      <div class="og-platforms">
        <span class="platform-badge">سلة Salla</span>
        <span class="platform-badge">زد Zid</span>
      </div>
    </div>
    <div class="og-visual">
      <div class="salla-logo">Salla</div>
      <div class="webhook-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-6h2v6zm0-8h-2V7h2v2z" fill="white"/>
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" fill="none" stroke="white" stroke-width="2"/>
          <circle cx="9" cy="12" r="2" fill="white"/>
          <circle cx="15" cy="12" r="2" fill="white"/>
        </svg>
      </div>
      <div class="zid-logo">Zid</div>
    </div>
    <div class="instructions">Right-click and save as image / انقر بزر الماوس الأيمن وحفظ كصورة</div>
  </div>

  <script>
    // Alternative: Use html2canvas to generate PNG
    // Uncomment to use:
    // import html2canvas from 'html2canvas';
    // html2canvas(document.querySelector('.og-container')).then(canvas => {
    //   document.body.appendChild(canvas);
    // });
  </script>
</body>
</html>
